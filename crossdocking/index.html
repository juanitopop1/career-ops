<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asignación Crossdocking</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d7dbe0;--ok:#1a7f4b;--warn:#b7791f;--bad:#c0392b;--ac:#2456d6;--belt:#111}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2127;--tx:#e8eaed;--mut:#98a0ab;--bd:#343a43;--ok:#4cc38a;--warn:#e0a93b;--bad:#ef6b5b;--ac:#6d93ff;--belt:#000}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 8px}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0;color:var(--mut)}
input,textarea,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:4px 6px;font:inherit}
label input{width:90px}textarea{width:100%;height:60px}
table{width:100%;border-collapse:collapse}td{padding:2px}td input{width:100%}td.s input{width:64px}
button{background:var(--ac);color:#fff;border:0;border-radius:4px;padding:4px 10px;cursor:pointer;font:inherit}
button.x{background:var(--bad);padding:2px 8px}
details{margin-top:8px;color:var(--mut)}
#plan{margin-bottom:12px;overflow-x:auto}#plan table{width:auto;min-width:100%}#plan th,#plan td{padding:4px 10px;text-align:center}
#plan tr.sel{background:var(--ac);color:#fff}#plan tbody tr{cursor:pointer}
#sum{font-weight:600;margin-bottom:6px}
.msg{padding:6px 10px;border-radius:6px;margin:4px 0;background:var(--card);border:1px solid var(--bad);color:var(--bad)}
.lay{overflow-x:auto;padding-bottom:8px}
.line{display:grid;grid-template-columns:1fr 60px 1fr;gap:8px;min-width:720px}
.side{display:flex;flex-direction:column;gap:6px}
.belt{background:var(--belt);border-radius:6px;color:#aaa;writing-mode:vertical-rl;text-align:center;letter-spacing:6px;font-size:12px;padding:8px 0}
.sh{background:#ffe600;color:#000;font-weight:700;text-align:center;border-radius:6px;padding:6px}
.sh small{display:block;font-weight:400;color:#333}
.rowc{display:flex;gap:4px}.right .rowc{flex-direction:row-reverse}
.isla,.cod,.rep{flex:1;background:var(--card);border:2px solid var(--ok);border-radius:6px;padding:4px;min-height:62px}
.warn{border-color:var(--warn)}.bad{border-color:var(--bad)}
.isla i,.cod b,.rep b{display:block;border-radius:3px;text-align:center;font-size:12px;font-style:normal;font-weight:700;color:#000}
.isla i{background:#22c55e}.cod b{background:#ffe600}
.rep{margin-top:auto}.rep b{background:#f6b98a}
small{color:var(--mut);display:block}
.chip{display:inline-block;color:#fff;border-radius:12px;padding:1px 8px;margin:2px 2px 0 0;font-size:12px}
.chip.i{background:#7c3aed}.chip.p{background:#16a34a}.chip.b{background:var(--ac)}.chip.r{background:#d9731f}
.gap{color:var(--bad);font-weight:700}
</style>
</head>
<body>
<h1>Asignación de colaboradores · Crossdocking</h1>

<div class="panel">
  <div class="card">
    <h2>Turno</h2>
    <label>Colaboradores disponibles <input id="staff" type="number" min="1" value="30"></label>
    <label>Total a procesar en el turno (paq) <input id="total" type="number" min="1" value="24000"></label>
    <label>Horas del turno <input id="hours" type="number" min="1" max="24" value="8"></label>
    <label>Nombres (uno por línea, opcional)<span></span></label>
    <textarea id="names" placeholder="Ana&#10;Luis&#10;..."></textarea>
    <details><summary>Ajustes (capacidad por persona, paq/h)</summary>
      <label>Inductor <input id="capInd" type="number" min="1" value="1200"></label>
      <label>Pescador <input id="capCanal" type="number" min="1" value="600"></label>
      <label>Bipeador <input id="capHH" type="number" min="1" value="450"></label>
      <label>Repesca <input id="capRep" type="number" min="1" value="400"></label>
      <label>% que cae a repesca <input id="repPct" type="number" min="0" max="100" value="3"></label>
    </details>
  </div>
  <div class="card">
    <h2>Volumen por hora (vacío = promedio)</h2>
    <table id="hourly"></table>
  </div>
  <div class="card">
    <h2 id="codesTitle">Demanda % por código</h2>
    <table id="codes"></table>
    <button id="add" style="margin-top:6px">+ código</button>
  </div>
</div>

<div id="plan"></div>
<div id="sum"></div>
<div id="msgs"></div>
<div id="moves" style="margin-bottom:8px"></div>
<div class="lay" id="layout"></div>

<script>
// ponytail: asignación greedy (cubre mínimo por prioridad, luego cada extra va a la estación más saturada).
// Techo: ignora distancia/ergonomía y topes físicos por posición; añadir tope por estación si hace falta.
function allocate({staff, volume, codes, capInd, capCanal, capHH, capRep, repPct}) {
  const tot = codes.reduce((a, c) => a + c.share, 0) || 1;
  const sides = ['FBM', 'COLECTA'].filter(s => codes.some(c => c.side === s));
  const sideLoad = s => codes.filter(c => c.side === s).reduce((a, c) => a + c.share, 0) / tot * volume;
  const st = [];
  sides.forEach(s => st.push({id: 'ind:' + s, type: 'Inductor', side: s, load: sideLoad(s), cap: capInd, n: 0}));
  sides.forEach(s => st.push({id: 'rep:' + s, type: 'Repesca', side: s, load: sideLoad(s) * repPct / 100, cap: capRep, n: 0}));
  [...codes].sort((a, b) => b.share - a.share).forEach(c => {
    const load = volume * c.share / tot;
    st.push({id: 'c:' + c.name, type: 'Pescador', side: c.side, code: c.name, load, cap: capCanal, n: 0},
            {id: 'h:' + c.name, type: 'Bipeador', side: c.side, code: c.name, load, cap: capHH, n: 0});
  });
  let left = staff;
  for (const s of st) if (left > 0) { s.n = 1; left--; }          // cobertura mínima por prioridad
  const util = s => s.load / (s.n * s.cap);
  while (left > 0) {                                               // extras a la más saturada
    const s = st.filter(x => x.n > 0).reduce((a, b) => util(b) > util(a) ? b : a);
    s.n++; left--;
  }
  st.forEach(s => s.util = s.n ? util(s) : Infinity);
  return st;
}

// autocheck: con 3 personas cubre los 2 inductores y una repesca; el total siempre cuadra
(function () {
  const base = {volume: 1000, codes: [{name: 'A', share: 70, side: 'FBM'}, {name: 'B', share: 30, side: 'COLECTA'}], capInd: 1000, capCanal: 500, capHH: 500, capRep: 500, repPct: 5};
  const a = allocate({...base, staff: 3});
  console.assert(a.reduce((s, x) => s + x.n, 0) === 3 && a.find(x => x.id === 'ind:COLECTA').n === 1 && a.find(x => x.id === 'c:A').n === 0, 'min coverage');
  const b = allocate({...base, staff: 12});
  console.assert(b.reduce((s, x) => s + x.n, 0) === 12 && b.every(x => x.n >= 1), 'total/coverage');
})();

const $ = id => document.getElementById(id);
const num = id => Math.max(0, +$(id).value || 0);
let codes = [['ERMX', 22], ['SRM1', 18], ['SRM2', 14], ['RMX1', 12], ['SXI1', 10], ['SPM1/SLT1', 8], ['EPM2', 7], ['HIBRIDO', 5], ['SRC1', 4]]
  .map(([name, share], i) => ({name, share, side: i % 2 ? 'COLECTA' : 'FBM'}));
let view = 0, hv = [], sh = {}; // view 0 = plan inicial; hv[h-1] = volumen de la hora h; sh[h][i] = % del código i en la hora h
const H = () => Math.min(24, Math.max(1, Math.floor(num('hours'))));
const vol = h => (h === 0 || hv[h - 1] === undefined) ? num('total') / H() : hv[h - 1];
const hcodes = h => codes.map((c, i) => ({name: c.name, side: c.side, share: h ? sh[h]?.[i] ?? c.share : c.share})).filter(c => c.name);
const alloc = h => allocate({staff: Math.floor(num('staff')), volume: vol(h), codes: hcodes(h),
  capInd: num('capInd') || 1, capCanal: num('capCanal') || 1, capHH: num('capHH') || 1,
  capRep: num('capRep') || 1, repPct: num('repPct')});

function drawCodes() {
  $('codesTitle').textContent = 'Demanda % por código · ' + (view ? 'Hora ' + view + ' (vacío = base)' : 'plan inicial (base)');
  $('codes').innerHTML = codes.map((c, i) =>
    `<tr><td><input data-i="${i}" data-k="name" value="${c.name}"></td>
     <td class="s"><input data-i="${i}" data-k="share" type="number" min="0" placeholder="${c.share}" value="${view === 0 ? c.share : sh[view]?.[i] ?? ''}"></td>
     <td><select data-i="${i}" data-k="side"><option${c.side === 'FBM' ? ' selected' : ''}>FBM</option><option${c.side === 'COLECTA' ? ' selected' : ''}>COLECTA</option></select></td>
     <td><button class="x" data-del="${i}">×</button></td></tr>`).join('');
}

function drawHours() {
  $('hourly').innerHTML = Array.from({length: H()}, (_, i) =>
    `<tr><td>Hora ${i + 1}</td><td class="s"><input data-h="${i}" type="number" min="0" placeholder="${Math.round(num('total') / H())}" value="${hv[i] ?? ''}"></td></tr>`).join('');
}

// tabla de pivoteo: personas por rol en cada hora; clic en una fila = ver su layout
function drawPlan() {
  const cnt = (st, t) => st.filter(s => s.type === t).reduce((a, s) => a + s.n, 0);
  const row = h => {
    const st = alloc(h), w = Math.max(...st.map(s => s.util));
    return `<tr data-view="${h}" class="${h === view ? 'sel' : ''}"><td>${h ? 'Hora ' + h : 'Plan inicial'}</td><td>${Math.round(vol(h))}</td>
      <td>${cnt(st, 'Inductor')}</td><td>${cnt(st, 'Pescador')}</td><td>${cnt(st, 'Bipeador')}</td><td>${cnt(st, 'Repesca')}</td>
      <td>${isFinite(w) ? Math.round(w * 100) + '%' : 'sin cubrir'}</td></tr>`;
  };
  const real = Array.from({length: H()}, (_, i) => vol(i + 1)).reduce((a, b) => a + b, 0);
  $('plan').innerHTML = `<table class="card"><thead><tr><th>Vista</th><th>Paq/h</th><th>Inductor</th><th>Pescador</th><th>Bipeador</th><th>Repesca</th><th>Uso máx</th></tr></thead>
    <tbody>${Array.from({length: H() + 1}, (_, h) => row(h)).join('')}</tbody></table>
    <div style="color:var(--mut);margin-top:4px">Suma por hora: ${Math.round(real)} / total turno: ${Math.round(num('total'))}</div>`;
}

function render() {
  const staff = Math.floor(num('staff'));
  const names = $('names').value.split('\n').map(s => s.trim()).filter(Boolean);
  const nm = i => names[i] || 'C' + String(i + 1).padStart(2, '0');
  view = Math.min(view, H());
  const st = alloc(view);
  drawPlan();
  let k = 0;
  const gaps = [];
  for (const s of st) {
    s.people = Array.from({length: s.n}, () => nm(k++));
    if (s.n === 0) gaps.push(`${s.type} ${s.code || s.side}`);
  }
  const S = Object.fromEntries(st.map(s => [s.id, s]));
  const cls = s => s.n === 0 || s.util > 1 ? 'bad' : s.util > .85 ? 'warn' : '';
  const info = s => `<small>${Math.round(s.load)}/h · ${s.n ? Math.round(s.util * 100) + '%' : '<span class="gap">SIN CUBRIR</span>'}</small>`;
  const chips = (s, c) => s.people.map(p => `<span class="chip ${c}">${p}</span>`).join('');
  const side = (sd, cl) => {
    const ind = S['ind:' + sd], rep = S['rep:' + sd];
    if (!ind) return `<div class="side ${cl}"></div>`;
    const rows = hcodes(view).filter(c => c.side === sd).sort((a, b) => b.share - a.share).map((c, i) => {
      const p = S['c:' + c.name], b = S['h:' + c.name];
      return `<div class="rowc"><div class="isla ${cls(p)}"><i>ISLA ${i + 1}</i>${info(p)}${chips(p, 'p')}</div>
        <div class="cod ${cls(b)}"><b>${c.name} · ${c.share}%</b>${info(b)}${chips(b, 'b')}</div></div>`;
    }).join('');
    return `<div class="side ${cl}"><div class="sh">INDUCCIÓN ${sd}<small>${Math.round(ind.load)} paq/h</small>${chips(ind, 'i')}</div>${rows}
      <div class="rep ${cls(rep)}"><b>REPESCA</b>${info(rep)}${chips(rep, 'r')}</div></div>`;
  };
  $('layout').innerHTML = `<div class="line">${side('FBM', 'left')}<div class="belt">CINTA TRANSPORTADORA</div>${side('COLECTA', 'right')}</div>
    <div style="color:var(--mut);margin-top:6px"><span class="chip i">Inductor</span><span class="chip p">Pescador</span><span class="chip b">Bipeador</span><span class="chip r">Repesca</span></div>`;

  const worst = Math.max(...st.map(s => s.util));
  $('sum').textContent = `${view ? 'Hora ' + view : 'Plan inicial'} · Asignados: ${k}/${staff} · Cuello de botella: ${isFinite(worst) ? Math.round(worst * 100) + '%' : 'posiciones sin cubrir'}`;
  $('msgs').innerHTML = (gaps.length ? `<div class="msg">Faltan colaboradores. Sin cubrir: ${gaps.join(', ')}</div>` : '') +
    (worst > 1 && !gaps.length ? `<div class="msg">Sobrecarga: con este personal no se alcanza el volumen (uso &gt; 100%).</div>` : '');
  const prev = view ? alloc(view - 1) : [];
  const moves = st.map(s => [s, s.n - (prev.find(p => p.id === s.id)?.n ?? 0)]).filter(([, d]) => d)
    .map(([s, d]) => `${d > 0 ? '+' : ''}${d} ${s.type} ${s.code || s.side}`);
  $('moves').innerHTML = view ? `<b>Movimientos vs ${view > 1 ? 'hora ' + (view - 1) : 'plan inicial'}:</b> ${moves.join(' · ') || 'sin cambios'}` : '';
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.k === 'share' && view) (sh[view] ??= {})[t.dataset.i] = t.value === '' ? undefined : +t.value;
  else if (t.dataset.k) codes[t.dataset.i][t.dataset.k] = t.dataset.k === 'share' ? +t.value || 0 : t.value;
  if (t.dataset.h) hv[+t.dataset.h] = t.value === '' ? undefined : +t.value;
  if (t.id === 'hours') { hv.length = H(); drawHours(); }
  if (t.id === 'total') drawHours();
  render();
});
document.addEventListener('click', e => {
  const tr = e.target.closest('tr[data-view]');
  if (tr) { view = +tr.dataset.view; drawCodes(); render(); }
  if (e.target.dataset.del !== undefined) {
    const d = +e.target.dataset.del; codes.splice(d, 1);
    for (const h in sh) sh[h] = Object.fromEntries(Object.entries(sh[h]).filter(([i]) => +i !== d).map(([i, v]) => [+i > d ? i - 1 : i, v]));
    drawCodes(); render();
  }
  if (e.target.id === 'add') { codes.push({name: 'Código ' + (codes.length + 1), share: 5, side: 'FBM'}); drawCodes(); render(); }
});
drawCodes(); drawHours(); render();
</script>
</body>
</html>
