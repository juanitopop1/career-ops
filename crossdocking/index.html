<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asignación Crossdocking</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d7dbe0;--ok:#1a7f4b;--warn:#b7791f;--bad:#c0392b;--ac:#2456d6}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2127;--tx:#e8eaed;--mut:#98a0ab;--bd:#343a43;--ok:#4cc38a;--warn:#e0a93b;--bad:#ef6b5b;--ac:#6d93ff}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 8px}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0;color:var(--mut)}
input,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:4px 6px;font:inherit}
label input{width:90px}textarea{width:100%;height:70px}
table{width:100%;border-collapse:collapse}td{padding:2px}td input{width:100%}td.s input{width:64px}
button{background:var(--ac);color:#fff;border:0;border-radius:4px;padding:4px 10px;cursor:pointer;font:inherit}
button.x{background:var(--bad);padding:2px 8px}
#sum{margin-bottom:12px;font-weight:600}
.msg{padding:6px 10px;border-radius:6px;margin:4px 0;background:var(--card);border:1px solid var(--bad);color:var(--bad)}
.lay{overflow-x:auto;padding-bottom:8px}
.row{display:flex;gap:10px;margin-bottom:6px;align-items:stretch}
.cols{display:flex;gap:10px;min-width:max-content}
.col{width:150px;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.belt{height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--bd) 0 14px,var(--mut) 14px 18px);margin:18px 0 6px;position:relative}
.belt span{position:absolute;right:6px;top:-18px;font-size:11px;color:var(--mut)}
.lbl{text-align:center;font-size:11px;color:var(--mut);text-transform:uppercase}
.arrow{text-align:center;color:var(--mut)}
.st{background:var(--card);border:2px solid var(--ok);border-radius:8px;padding:8px;min-height:90px}
.st.warn{border-color:var(--warn)}.st.bad{border-color:var(--bad)}
.st b{display:block}.st small{color:var(--mut);display:block;margin-bottom:4px}
.chip{display:inline-block;background:var(--ac);color:#fff;border-radius:12px;padding:1px 8px;margin:2px 2px 0 0;font-size:12px}
.gap{color:var(--bad);font-weight:700}
.wide{min-width:200px}
</style>
</head>
<body>
<h1>Asignación de colaboradores · Crossdocking</h1>

<div class="panel">
  <div class="card">
    <h2>Turno</h2>
    <label>Colaboradores disponibles <input id="staff" type="number" min="1" value="30"></label>
    <label>Volumen (paquetes/hora) <input id="volume" type="number" min="1" value="3000"></label>
    <label>Nombres (opcional, uno por línea)<span></span></label>
    <textarea id="names" placeholder="Ana&#10;Luis&#10;..."></textarea>
  </div>
  <div class="card">
    <h2>Capacidad por persona (paq/h)</h2>
    <label>Inducción <input id="capInd" type="number" min="1" value="1200"></label>
    <label>Isla (canalización) <input id="capCanal" type="number" min="1" value="600"></label>
    <label>Handheld / armado HU <input id="capHH" type="number" min="1" value="450"></label>
    <label>Repesca <input id="capRep" type="number" min="1" value="400"></label>
    <label>% que cae a repesca <input id="repPct" type="number" min="0" max="100" value="3"></label>
  </div>
  <div class="card">
    <h2>Códigos / subcanales (demanda %)</h2>
    <table id="codes"></table>
    <button id="add" style="margin-top:6px">+ código</button>
  </div>
</div>

<div id="sum"></div>
<div id="msgs"></div>
<div class="lay" id="layout"></div>

<script>
// ponytail: asignación greedy (cubre mínimo por prioridad, luego da cada extra a la estación más saturada).
// Techo: ignora distancia/ergonomía y máximos por posición física; si hace falta, añadir tope por estación.
function allocate({staff, volume, codes, capInd, capCanal, capHH, capRep, repPct}) {
  const tot = codes.reduce((a, c) => a + c.share, 0) || 1;
  const st = [{id: 'ind', type: 'Inducción', load: volume, cap: capInd, n: 0},
              {id: 'rep', type: 'Repesca', load: volume * repPct / 100, cap: capRep, n: 0}];
  [...codes].sort((a, b) => b.share - a.share).forEach(c => {
    const load = volume * c.share / tot;
    st.push({id: 'c:' + c.name, type: 'Isla', code: c.name, load, cap: capCanal, n: 0},
            {id: 'h:' + c.name, type: 'Handheld', code: c.name, load, cap: capHH, n: 0});
  });
  let left = staff;
  for (const s of st) if (left > 0) { s.n = 1; left--; }          // cobertura mínima por prioridad
  const util = s => s.load / (s.n * s.cap);
  while (left > 0) {                                               // extras a la más saturada
    const s = st.filter(x => x.n > 0).reduce((a, b) => util(b) > util(a) ? b : a);
    s.n++; left--;
  }
  st.forEach(s => s.util = s.n ? util(s) : Infinity);
  return st;
}

// autocheck: con 3 personas cubre inducción, repesca y el código más pedido; el total siempre cuadra
(function () {
  const base = {volume: 1000, codes: [{name: 'A', share: 70}, {name: 'B', share: 30}], capInd: 1000, capCanal: 500, capHH: 500, capRep: 500, repPct: 5};
  const a = allocate({...base, staff: 3});
  console.assert(a.reduce((s, x) => s + x.n, 0) === 3 && a.find(x => x.id === 'c:A').n === 1 && a.find(x => x.id === 'h:A').n === 0, 'min coverage');
  const b = allocate({...base, staff: 10});
  console.assert(b.reduce((s, x) => s + x.n, 0) === 10 && b.every(x => x.n >= 1), 'total/coverage');
})();

const $ = id => document.getElementById(id);
const num = id => Math.max(0, +$(id).value || 0);
let codes = [22, 18, 14, 12, 10, 8, 7, 5, 4].map((s, i) => ({name: 'Código ' + (i + 1), share: s}));

function drawCodes() {
  $('codes').innerHTML = codes.map((c, i) =>
    `<tr><td><input data-i="${i}" data-k="name" value="${c.name}"></td>
     <td class="s"><input data-i="${i}" data-k="share" type="number" min="0" value="${c.share}"></td>
     <td><button class="x" data-del="${i}">×</button></td></tr>`).join('');
}

function render() {
  const staff = Math.floor(num('staff'));
  const names = $('names').value.split('\n').map(s => s.trim()).filter(Boolean);
  const nm = i => names[i] || 'C' + String(i + 1).padStart(2, '0');
  const valid = codes.filter(c => c.name);
  const st = allocate({staff, volume: num('volume'), codes: valid,
    capInd: num('capInd') || 1, capCanal: num('capCanal') || 1, capHH: num('capHH') || 1,
    capRep: num('capRep') || 1, repPct: num('repPct')});
  let k = 0;
  const html = {}, gaps = [];
  for (const s of st) {
    s.people = Array.from({length: s.n}, () => nm(k++));
    const cls = s.n === 0 || s.util > 1 ? 'bad' : s.util > .85 ? 'warn' : '';
    if (s.n === 0) gaps.push(s.type + (s.code ? ' ' + s.code : ''));
    html[s.id] = `<div class="st ${cls}"><b>${s.type}${s.code ? ' · ' + s.code : ''}</b>
      <small>${Math.round(s.load)} paq/h · ${s.n ? Math.round(s.util * 100) + '% uso' : '<span class="gap">SIN CUBRIR</span>'}</small>
      ${s.people.map(p => `<span class="chip">${p}</span>`).join('')}</div>`;
  }
  const worst = Math.max(...st.map(s => s.util));
  $('sum').textContent = `Asignados: ${k}/${staff} · Cuello de botella: ${isFinite(worst) ? Math.round(worst * 100) + '%' : 'posiciones sin cubrir'}`;
  $('msgs').innerHTML = (gaps.length ? `<div class="msg">Faltan colaboradores. Sin cubrir: ${gaps.join(', ')}</div>` : '') +
    (worst > 1 && !gaps.length ? `<div class="msg">Sobrecarga: con este personal no se alcanza el volumen (uso &gt; 100%).</div>` : '');
  const cols = [...valid].sort((a, b) => b.share - a.share).map(c => `
    <div class="col"><div class="lbl">${c.name} · ${c.share}%</div>
      ${html['c:' + c.name]}<div class="arrow">▼ tolva</div>${html['h:' + c.name]}</div>`).join('');
  $('layout').innerHTML = `
    <div class="row"><div class="wide">${html.ind}</div><div style="flex:1;align-self:center"><div class="belt"><span>cinta →</span></div></div></div>
    <div class="lbl" style="text-align:left">Islas (toman el código de su posición → tolva) y handheld al final de cada brazo</div>
    <div class="cols">${cols}</div>
    <div class="belt"><span>fin de línea → repesca</span></div>
    <div class="wide">${html.rep}</div>`;
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.k) codes[t.dataset.i][t.dataset.k] = t.dataset.k === 'share' ? +t.value || 0 : t.value;
  render();
});
document.addEventListener('click', e => {
  if (e.target.dataset.del !== undefined) { codes.splice(+e.target.dataset.del, 1); drawCodes(); render(); }
  if (e.target.id === 'add') { codes.push({name: 'Código ' + (codes.length + 1), share: 5}); drawCodes(); render(); }
});
drawCodes(); render();
</script>
</body>
</html>
